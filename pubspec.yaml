name: carryon
description: "CarryOn - peer-to-peer parcel delivery. Send, receive or carry packages along your travel routes."
publish_to: 'none'

version: 56.0.0+56

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # UI
  cupertino_icons: ^1.0.9
  gap: ^3.0.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  # State management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  # Navigation
  go_router: ^17.4.0
  # Cache & Database
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  # Codegen annotations
  freezed_annotation: ^3.1.0
  # Logging
  logger: ^2.7.0
  pretty_dio_logger: ^1.4.0
  # Networking
  retrofit: ^4.9.2
  dio: ^5.11.0
  # Localization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  # Device & platform
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.13.1
  image_picker: ^1.2.0
  file_picker: ^13.1.0
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  connectivity_plus: ^6.1.5
  # Push notifications
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2
  flutter_stripe: ^14.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  flutter_gen_runner: ^5.15.0
  retrofit_generator: ^10.2.8
  # WHY: freezed 3 emits `final` on a generated constructor parameter, which
  # Dart 3.13 rejects; the 4.0.0-dev line is the first that compiles.
  freezed: ^4.0.0-dev.3
  http_mock_adapter: ^0.6.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/stats/
    - assets/icons/

flutter_gen:
  output: lib/src/presentation/core/gen
  line_length: 80

  integrations:
    flutter_svg: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
